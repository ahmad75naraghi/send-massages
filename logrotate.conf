# ============================================================
#  logrotate.conf — نگهداری چرخش لاگ‌ها
#  نصب:  cp logrotate.conf /etc/logrotate.d/eitaa-sync
#        chown root:root /etc/logrotate.d/eitaa-sync && chmod 644 /etc/logrotate.d/eitaa-sync
#        logrotate -d /etc/logrotate.d/eitaa-sync   (تست حالت خشک)
# ============================================================

/home/file/public_html/s/logs/*.log {
    daily
    rotate 14
    size 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su file file
    create 0640 file file
}

/home/file/public_html/s/logs/send_*.log {
    weekly
    rotate 4
    size 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su file file
}

/var/log/eitaa-sync/*.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    copytruncate
}
